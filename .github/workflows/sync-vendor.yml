name: Sync third-party skills

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-vendor
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VENDOR_REPORT: ${{ runner.temp }}/vendor-report.md
      ISSUE_LABEL: vendor-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync upstream skills
        id: sync
        run: node scripts/sync-vendor.mjs

      - name: Commit changes
        if: steps.sync.outputs.updated != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A skills vendor.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(vendor): sync ${{ steps.sync.outputs.updated }}"
          git push

      - name: Report problems
        if: steps.sync.outputs.problems == 'true'
        run: |
          gh label create "$ISSUE_LABEL" --color d93f0b --description "Third-party skill sync" --force
          existing=$(gh issue list --label "$ISSUE_LABEL" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$VENDOR_REPORT"
          else
            gh issue create --title "Third-party skill sync needs attention" --label "$ISSUE_LABEL" --body-file "$VENDOR_REPORT"
          fi

      - name: Close resolved issue
        if: steps.sync.outputs.problems == 'false'
        run: |
          for n in $(gh issue list --label "$ISSUE_LABEL" --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Sync succeeded for every skill in run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
          done

  notify-failure:
    needs: sync
    if: failure()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Open issue for broken workflow
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Third-party skill sync workflow failed" \
            --body "The sync workflow crashed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
